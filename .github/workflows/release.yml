name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dalamud SDK
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:AppData 'XIVLauncher\addon\Hooks\dev'
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          New-Item -ItemType Directory -Force -Path $dalamudHome | Out-Null
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $dalamudHome -Force

      - name: Restore dependencies
        run: dotnet restore XIVPortStudio.csproj

      - name: Build plugin
        run: dotnet build XIVPortStudio.csproj --configuration Release --no-restore

      - name: Prepare release asset
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $package = Join-Path $PWD 'bin/Release/XIVPortStudio/latest.zip'
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Dalamud package was not produced: $package"
          }
          Copy-Item -LiteralPath $package -Destination (Join-Path $artifactDirectory 'XIVPortStudio.zip') -Force
          Copy-Item -LiteralPath $package -Destination (Join-Path $artifactDirectory 'latest.zip') -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/XIVPortStudio.zip
            release-assets/latest.zip
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
